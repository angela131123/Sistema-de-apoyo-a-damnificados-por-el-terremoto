<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de damnificados | Apoyo a damnificados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="./css/styles.css" rel="stylesheet" />
    <script src="./js/recursos.js" defer></script>
    <script src="./js/formulario.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-dark menu">
      <div class="container">
        <a class="navbar-brand marca" href="./index.html">
          <span class="escudos">
            <img
              src="./img/escudopereira.webp"
              alt="Escudo de Pereira"
              width="32"
              height="32"
            />
            <img
              src="./img/escudorisaralda.jpeg"
              alt="Escudo de Risaralda"
              width="32"
              height="32"
            />
          </span>
          Apoyo a damnificados
        </a>
      </div>
    </nav>
    <main class="container py-4 py-md-5">
      <h1 class="titulo-interior mb-3">Registro de damnificados</h1>
      <p>
        Completa tus datos e indica qué ayuda necesitas. Las fotos son
        opcionales.
      </p>
      <noscript
        ><p class="alert alert-danger">
          Activa JavaScript para enviar el formulario.
        </p></noscript
      >
      <p id="mensaje-registro" role="status" hidden></p>
      <form
        id="registro"
        method="post"
        action="/api/damnificados"
        enctype="multipart/form-data"
        class="tarjeta tarjeta-formulario p-3 p-md-4"
      >
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="tipo_documento"
              >Tipo de documento</label
            >
            <input
              class="form-control"
              id="tipo_documento"
              name="tipo_documento"
              maxlength="20"
              required
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="numero_documento"
              >Número de documento</label
            >
            <input
              class="form-control"
              id="numero_documento"
              name="numero_documento"
              maxlength="30"
              required
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="nombres">Nombres</label>
            <input
              class="form-control"
              id="nombres"
              name="nombres"
              maxlength="100"
              autocomplete="given-name"
              required
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="apellidos">Apellidos</label>
            <input
              class="form-control"
              id="apellidos"
              name="apellidos"
              maxlength="100"
              autocomplete="family-name"
              required
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="fecha_nacimiento"
              >Fecha de nacimiento (opcional)</label
            >
            <input
              class="form-control"
              id="fecha_nacimiento"
              name="fecha_nacimiento"
              type="date"
              min="1000-01-01"
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="telefono">Teléfono (opcional)</label>
            <input
              class="form-control"
              id="telefono"
              name="telefono"
              type="tel"
              maxlength="20"
              autocomplete="tel"
              aria-describedby="ayuda-telefono"
            />
            <div id="ayuda-telefono" class="form-text">
              Si quieres recibir avisos de orientación por WhatsApp, escribe tu
              número celular.
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="direccion_afectada"
              >Dirección afectada (opcional)</label
            >
            <input
              class="form-control"
              id="direccion_afectada"
              name="direccion_afectada"
              maxlength="200"
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="tipo_de_damnificacion"
              >Tipo de afectación (opcional)</label
            >
            <input
              class="form-control"
              id="tipo_de_damnificacion"
              name="tipo_de_damnificacion"
              maxlength="100"
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="descripcion"
              >Descripción de la afectación (opcional)</label
            >
            <textarea
              class="form-control"
              id="descripcion"
              name="descripcion"
              maxlength="1000"
              rows="4"
            ></textarea>
          </div>
          <div class="col-12">
            <label class="form-label" for="fotos"
              >Fotos de la afectación (opcional)</label
            >
            <input
              class="form-control"
              id="fotos"
              name="fotos"
              type="file"
              multiple
              accept="image/jpeg,image/png,image/webp"
              aria-describedby="ayuda-fotos"
            />
            <div class="form-text" id="ayuda-fotos">
              Hasta 3 fotos JPG, PNG o WebP. Máximo 3 MB por foto.
            </div>
            <div class="row g-2 mt-1" id="vista-fotos" aria-live="polite"></div>
          </div>
        </div>
        <fieldset class="border-top mt-4 pt-3">
          <legend class="float-none w-auto titulo-interior fs-5">
            ¿Qué necesitas?
          </legend>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label" for="recurso"
                >Recurso que necesitas</label
              >
              <select
                class="form-select"
                id="recurso"
                name="id_recurso"
                required
              >
                <option value="">Selecciona un recurso</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="cantidad">Cantidad</label>
              <input
                class="form-control"
                id="cantidad"
                name="cantidad"
                type="number"
                min="0.01"
                max="99999999.99"
                step="0.01"
                required
              />
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="prioridad">Prioridad</label>
              <select
                class="form-select"
                id="prioridad"
                name="prioridad"
                required
              >
                <option value="Media">Media</option>
                <option value="Alta">Alta</option>
                <option value="Baja">Baja</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="observaciones-necesidad"
                >Detalles de la necesidad (opcional)</label
              >
              <textarea
                class="form-control"
                id="observaciones-necesidad"
                name="observaciones_necesidad"
                maxlength="250"
                rows="3"
              ></textarea>
            </div>
          </div>
        </fieldset>
        <button class="btn boton-principal mt-4" disabled>
          Guardar registro
        </button>
      </form>
    </main>
    <footer class="pie-pagina py-3 text-center">
      <span class="escudos">
        <img
          src="./img/escudopereira.webp"
          alt="Escudo de Pereira"
          width="32"
          height="32"
        />
        <img
          src="./img/escudorisaralda.jpeg"
          alt="Escudo de Risaralda"
          width="32"
          height="32"
        />
      </span>
      <p class="mb-0 mt-2">Pereira, Risaralda</p>
    </footer>
  </body>
</html>
