<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ofrecer una donación | Apoyo a damnificados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="./css/styles.css" rel="stylesheet" />
    <script src="./js/recursos.js" defer></script>
    <script src="./js/donaciones.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-dark menu">
      <div class="container">
        <a class="navbar-brand marca" href="./index.html">
          <span class="escudos">
            <img
              src="./img/escudopereira.webp"
              alt="Escudo de Pereira"
              width="32"
              height="32"
            />
            <img
              src="./img/escudorisaralda.jpeg"
              alt="Escudo de Risaralda"
              width="32"
              height="32"
            />
          </span>
          Volver al inicio
        </a>
      </div>
    </nav>
    <main class="container py-4 py-md-5">
      <h1 class="titulo-interior mb-3">Ofrecer una donación</h1>
      <p>
        Registra qué recurso puedes ofrecer y deja un contacto para coordinar la
        entrega. Tu aporte se guarda como una oferta.
      </p>
      <p>
        Para donar dinero o consultar puntos de acopio, revisa los
        <a href="./index.html#donar">canales oficiales</a>.
      </p>
      <noscript
        ><p class="alert alert-danger">
          Activa JavaScript para enviar la oferta.
        </p></noscript
      >
      <p id="mensaje-donacion" role="status" hidden></p>
      <form
        id="oferta-donacion"
        method="post"
        action="/api/ofertas-donacion"
        class="tarjeta tarjeta-formulario p-3 p-md-4"
      >
        <div class="row g-3">
          <div class="col-12 col-md-8">
            <label class="form-label" for="nombre"
              >Nombre de la persona u organización</label
            >
            <input
              class="form-control"
              id="nombre"
              name="nombre"
              maxlength="150"
              required
            />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="tipo">Tipo de donante</label>
            <select class="form-select" id="tipo" name="tipo" required>
              <option value="Persona">Persona</option>
              <option value="Organizacion">Organización</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="telefono">Teléfono</label>
            <input
              class="form-control"
              id="telefono"
              name="telefono"
              type="tel"
              maxlength="20"
              autocomplete="tel"
              aria-describedby="ayuda-contacto"
            />
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="correo">Correo electrónico</label>
            <input
              class="form-control"
              id="correo"
              name="correo"
              type="email"
              maxlength="100"
              autocomplete="email"
              aria-describedby="ayuda-contacto"
            />
          </div>
          <div class="col-12 form-text" id="ayuda-contacto">
            Escribe al menos un teléfono o un correo electrónico.
          </div>
          <div class="col-12 col-md-8">
            <label class="form-label" for="recurso">Recurso que ofreces</label>
            <select class="form-select" id="recurso" name="id_recurso" required>
              <option value="">Selecciona un recurso</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="cantidad">Cantidad</label>
            <input
              class="form-control"
              id="cantidad"
              name="cantidad"
              type="number"
              min="0.01"
              max="99999999.99"
              step="0.01"
              required
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="observaciones"
              >Detalles de la donación (opcional)</label
            >
            <textarea
              class="form-control"
              id="observaciones"
              name="observaciones"
              maxlength="250"
              rows="3"
            ></textarea>
          </div>
        </div>
        <button class="btn boton-principal mt-4" type="submit" disabled>
          Enviar oferta
        </button>
      </form>
    </main>
  </body>
</html>
